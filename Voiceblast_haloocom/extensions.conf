;CUSTOMIZED VOICEBLAST WITH DTMF
[voiceblast]

;==========================================================
; Answered Call Flow
;==========================================================

exten => s,1,NoOp(--- Voiceblast Started for Lead ID: ${LEAD_ID} ---)

; Mark that this call was actually answered
same => n,Set(CALL_STATUS=ANSWERED)

; Save answer time
same => n,Set(START_TIME=${EPOCH})

; Update DB as answered
same => n,AGI(voiceblast_agi.php,answered,${LEAD_ID})

; Recording directory
same => n,Set(RECORDING_DIR=/var/www/html/Voiceblast_haloocom/recordings)

; Recording filename
same => n,Set(RECORDING_FILE=${RECORDING_DIR}/${LIST_ID}_${LEAD_ID}_${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}.wav)

; Ensure directory exists
same => n,System(mkdir -p ${RECORDING_DIR})

; Start recording
;same => n,MixMonitor(${RECORDING_FILE},b)
same => n,MixMonitor(${RECORDING_FILE})

; Play audio and collect one DTMF digit
same => n,Read(DTMF_RESULT,${AUDIO_PATH},1,,1,5)

; End call
same => n,Hangup()


;==========================================================
; Failed Call Flow (Busy / No Answer / Rejected)
;==========================================================

exten => failed,1,NoOp(--- Voiceblast Call Failed for Lead ID: ${LEAD_ID} ---)

; Mark call as failed
same => n,Set(CALL_STATUS=FAILED)

; Failure reason from Asterisk
same => n,Set(FAIL_REASON=${TXTCALLFAILREASON})

; If empty, use default
same => n,GotoIf($["${FAIL_REASON}"=""]?defaultreason)

same => n,Goto(logfail)

same => n(defaultreason),Set(FAIL_REASON=NO ANSWER OR REJECTED)

same => n(logfail),AGI(voiceblast_agi.php,failed,${LEAD_ID},${FAIL_REASON})

same => n,Hangup()


;==========================================================
; Hangup Handler
;==========================================================

exten => h,1,NoOp(--- Call Hangup for Lead ID: ${LEAD_ID} ---)

; Stop recording if running
same => n,StopMixMonitor()

; If the call failed, do NOT mark it completed
same => n,GotoIf($["${CALL_STATUS}"="FAILED"]?end)

; START_TIME may not exist
same => n,GotoIf($["${START_TIME}"=""]?noduration)

same => n,Set(CALL_DURATION=$[${EPOCH}-${START_TIME}])
same => n,Goto(savedata)

same => n(noduration),Set(CALL_DURATION=0)

same => n(savedata),AGI(voiceblast_agi.php,completed,${LEAD_ID},${CALL_DURATION},${DTMF_RESULT},${RECORDING_FILE})

same => n(end),NoOp(Call was not answered. Skipping completed update.)

